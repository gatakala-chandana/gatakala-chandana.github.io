  var b = function(x){ return Uint8Array.from(atob(x), function(c){ return c.charCodeAt(0); }); };
  async function open(pw){
    var s = await (await fetch("../../nda/salt.json")).json();
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(s.salt), iterations:s.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(DATA.iv)}, key, b(DATA.ct));
    try { localStorage.setItem("nda-pw", pw); } catch(e) {}
    var html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }
  var gate = document.getElementById("gate"), f = document.getElementById("f"), inp = document.getElementById("pw"), msg = document.getElementById("msg");
  f.addEventListener("submit", async function(e){
    e.preventDefault(); msg.textContent = ""; document.body.classList.add("busy");
    try { await open(inp.value); } catch(err) { document.body.classList.remove("busy"); msg.textContent = "That password didn't work. Try again."; inp.select(); }

  var saved = null; try { saved = localStorage.getItem("nda-pw"); } catch(e) {}
