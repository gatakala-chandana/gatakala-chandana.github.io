<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curo · Patient app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef1f6;--app:#f6f8fb;--card:#fff;--ink:#111827;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;--line:#e5e7eb;--line2:#eef0f3;--blue:#2563eb;--blue2:#1d4ed8;--bsoft:#eef3ff;--bline:#c7d6ff;--green:#15803d;--gsoft:#f0fdf4;--gline:#bbf7d0;--red:#b91c1c;--rsoft:#fef2f2;--rline:#fecaca;--amber:#a16207;--asoft:#fffbeb;--aline:#fde68a;--g0:#cbd5e1;--g1:#facc15;--g2:#fb923c;--g3:#ef4444;--g4:#9f1239;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);--r:20px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid #93b4ff;outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em;font-weight:600}
p{margin:0}
.ic{flex:none;display:block}
/* stage */
.wrap{display:flex;justify-content:center;align-items:center;min-height:100svh;padding:20px 16px}
.stage{width:calc(417px*var(--k,1));height:calc(876px*var(--k,1));flex:none}
.stage>.phone{transform:scale(var(--k,1));transform-origin:0 0}
.phone{width:393px;height:852px;box-sizing:content-box;border:12px solid #0f1115;border-radius:67px;overflow:hidden;position:relative;background:var(--app);display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(15,23,42,.45)}
.phone.big{font-size:17px}
.sbar{display:flex;justify-content:space-between;align-items:center;height:54px;padding:4px 32px 0 40px;font-weight:600;font-size:17px;position:relative;z-index:3;flex:none}
.sbar i{width:125px;height:37px;background:#000;border-radius:20px;position:absolute;left:50%;top:11px;transform:translateX(-50%)}
.hind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:#111;transform:translateX(-50%);z-index:20;pointer-events:none}
.sbar.w{color:#fff;background:#3b82f6}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
/* hero */
.hero{background:linear-gradient(160deg,#3b82f6 0%,#2563eb 45%,#1d4ed8 100%);color:#fff;border-radius:0 0 28px 28px;padding:10px 20px 22px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);right:-90px;top:-80px}
.hero:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);right:40px;bottom:-90px}
.hero>*{position:relative;z-index:1}
.hrow{display:flex;align-items:center;gap:14px}
.hrow b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
.hrow span.s{opacity:.85;font-size:14px}
.hbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;position:relative;flex:none}
.hbtn .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#fb923c;border:2px solid #2563eb}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;border:2px solid rgba(255,255,255,.7)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptitle h1{font-size:26px}
.hero p.sub{opacity:.88;margin-top:6px;font-size:14px}
/* content */
.sec{padding:18px 18px 110px}
.sec h2{font-size:17px;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.sec h2:first-child{margin-top:4px}
.sec h2 small{font-size:13px;color:var(--ink3);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line2);font-size:14px}
.kv:first-child{border-top:0;padding-top:0}.kv:last-child{padding-bottom:0}
.kv span:first-child{color:var(--ink3)}.kv span:last-child{font-weight:500;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bsoft);color:var(--blue2);font-size:12.5px;font-weight:500}
.chip.g{background:var(--gsoft);color:var(--green)}.chip.a{background:var(--asoft);color:var(--amber)}.chip.r{background:var(--rsoft);color:var(--red)}.chip.n{background:#f3f4f6;color:var(--ink2)}
.mut{color:var(--ink3)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;transition:background .15s}
.btn:hover{background:var(--blue2)}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.o:hover{background:#f9fafb}
.btn.w{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
/* home */
.task{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;text-align:left;width:100%}
.task .rm{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#fde68a,#bfdbfe);display:grid;place-items:center;overflow:hidden}
.task b{font-size:16px;font-weight:600;display:block}
.task p{color:var(--ink3);font-size:13.5px;margin-top:2px}
.meter{height:8px;border-radius:99px;background:#e8edf6;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.tile span{width:62px;height:62px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);display:grid;place-items:center;color:var(--blue)}
.tile:hover span{border-color:var(--bline)}
.upd{display:flex;gap:12px}
.upd .bub{background:var(--app);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;color:var(--ink2);margin-top:8px}
.appt{display:flex;align-items:center;gap:12px}
.appt .dt{margin-left:auto;text-align:center;background:var(--bsoft);border-radius:14px;padding:6px 12px;color:var(--blue2);font-weight:600;line-height:1.15}
.appt .dt small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ico{width:44px;height:44px;border-radius:14px;background:var(--bsoft);color:var(--blue);display:grid;place-items:center;flex:none}
.row{display:flex;gap:12px;align-items:center}
/* nav */
.pnav{position:absolute;left:16px;right:16px;bottom:24px;height:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;box-shadow:0 12px 30px rgba(15,23,42,.12);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 8px;z-index:5}
.pnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink4);height:54px;justify-content:center;border-radius:999px}
.pnav button[aria-current]{color:var(--blue);background:var(--bsoft)}
.fab{position:absolute;right:20px;bottom:104px;width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px rgba(37,99,235,.35);z-index:5}
/* welcome */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(170deg,#3b82f6,#1e40af);color:#fff;padding:16px 24px 40px;position:relative;overflow:hidden}
.welcome:before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.07);right:-150px;top:30px}
.welcome>*{position:relative}
.welcome h1{font-size:34px;margin:22px 0 10px;letter-spacing:-.02em}
.welcome p{opacity:.9}
.wf{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.wf div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;font-size:14px}
.lsw{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px;gap:2px}
.lsw button{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:#fff;opacity:.85}
.lsw button[aria-pressed=true]{background:#fff;color:var(--blue2);opacity:1}
.wbtn{width:100%;min-height:54px;border-radius:999px;background:#fff;color:var(--blue2);font-weight:600;font-size:16px}
/* chat */
.ctop{display:flex;align-items:center;gap:6px;padding:6px 12px 8px;flex:none;background:var(--app)}
.ctop .t{flex:1;display:flex;align-items:center;gap:10px}
.ctop .t b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.ctop .t small{color:var(--ink3);font-size:12.5px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none;font-weight:600;font-size:13px}
.ib:hover{background:#e9edf4}
.ib.on{background:var(--bsoft);color:var(--blue2)}
.prog{padding:0 18px 10px;flex:none;background:var(--app);border-bottom:1px solid var(--line2)}
.prog .meter{margin-top:0;height:6px}
.prog div.l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-top:7px}
.chat{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.mr{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.mr .sp{width:34px;flex:none}
.mr .bub{background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 13px;max-width:82%;font-size:14.5px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.phone.big .mr .bub{font-size:16.5px}
.mr.me{justify-content:flex-end}
.mr.me .bub{background:var(--blue);color:#fff;border-color:var(--blue);border-radius:18px 18px 6px 18px}
.mr.me .bub img{max-width:180px;border-radius:12px;display:block}
.bub.alert{background:var(--rsoft);border-color:var(--rline)}
.bub.done{background:var(--gsoft);border-color:var(--gline)}
.bub.help{background:var(--asoft);border-color:var(--aline)}
.bub.sys{background:var(--bsoft);border-color:var(--bline)}
.bub ul{margin:6px 0 0;padding-left:18px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:14px}
.srow:first-of-type{margin-top:8px}
.gp{font-weight:600;color:color-mix(in srgb,var(--c) 70%,#111)}
.ans{padding:10px 12px 10px;border-top:1px solid var(--line2);background:#fff;flex:none;max-height:56%;overflow-y:auto}
.qopts{display:flex;flex-direction:column;gap:5px}
.qopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:44px}
.qopt:hover{border-color:var(--bline);background:#fafcff}
.qopt .rd{width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;flex:none;display:grid;place-items:center}
.qopt[aria-pressed=true]{border-color:var(--blue);background:var(--bsoft)}
.qopt[aria-pressed=true] .rd{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff}
.qopt .lb{flex:1}
.qopt .lb b{font-weight:600;font-size:14px}.qopt .lb small{display:inline!important;margin-left:6px}
.qopt .lb small{color:var(--ink3);font-size:12.5px;display:block;line-height:1.35}
.qopt .sw{width:12px;height:12px;border-radius:50%;flex:none}
.qpills{display:flex;flex-wrap:wrap;gap:8px}
.qpill{padding:10px 16px;border-radius:999px;border:1px solid var(--bline);background:var(--bsoft);color:var(--blue2);font-weight:600;font-size:14px;min-height:44px}
.qpill:hover{background:#e2eaff}
.qpill.go{background:var(--blue);border-color:var(--blue);color:#fff}
.qpill.go[disabled]{opacity:.45;cursor:default}
.qx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qx button{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:#f3f4f6;color:var(--ink2);font-size:12.5px;font-weight:500;min-height:34px}
.qx button:hover{background:#e9ebef}
.qx button.same{background:var(--gsoft);color:var(--green)}
.inbar{display:flex;gap:8px;align-items:flex-end;padding:8px 12px 30px;background:#fff;flex:none}
.inbar textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:22px;padding:11px 16px;background:var(--app);outline:none;font-size:14px}
.inbar textarea:focus{border-color:var(--bline);background:#fff}
.inbar .send{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.inbar label{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);cursor:pointer;flex:none}
/* notes */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.week button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:16px;color:#fff;font-size:12px;opacity:.9}
.week button b{font-size:16px;font-weight:600}
.week button[aria-pressed=true]{background:#fff;color:var(--blue2);opacity:1}
.week button i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg{display:inline-flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:#fff}
.seg button[aria-pressed=true]{background:#fff;color:var(--blue2)}
.seg.l{background:#eef1f6}.seg.l button{color:var(--ink3)}.seg.l button[aria-pressed=true]{color:var(--blue2);box-shadow:var(--sh)}
.sbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 6px 0 16px;height:48px;box-shadow:var(--sh)}
.sbox input{flex:1;border:0;outline:0;background:none}
.sbox button,.sbox .i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.hero .sbox{margin-top:16px;border:0}
.srch{display:flex;gap:10px;padding:16px 18px 0}
.srch .sbox{flex:1}
.fbtn{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink3);flex:none}
.fbtn[aria-pressed=true]{color:#e11d48;border-color:#fecdd3;background:#fff1f2}
.note{position:relative}
.note .dt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-right:34px}
.note p{margin-top:10px;color:var(--ink2)}
.note img{width:100%;border-radius:14px;margin-top:10px}
.note .kb{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.menu{position:absolute;right:12px;top:46px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(15,23,42,.12);padding:6px;z-index:4;min-width:190px}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px}
.menu button:hover{background:#f3f4f6}
.empty{text-align:center;color:var(--ink3);padding:26px 12px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px 40px;z-index:9}
.sheet textarea{width:100%;height:130px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0;resize:none;outline:none;background:var(--app)}
.sheet .rw{display:flex;gap:10px}.sheet .rw .btn{flex:1}
/* treatment */
.med{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px}
.med .im{width:60px;height:60px;border-radius:16px;background:var(--app);display:grid;place-items:center}
.med .im svg{width:44px;height:44px}
.med b{font-weight:600;display:block}
.med small{display:block;color:var(--ink3);font-size:13px}
.med p{font-size:13.5px;color:var(--ink2);margin-top:6px}
.med.pri{border-color:var(--bline);background:linear-gradient(#fff,#fafcff)}
/* progress */
.sym .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sym .top b{font-weight:600}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 4px}
.dots span{height:28px;border-radius:9px;display:grid;place-items:center;font-size:11.5px;font-weight:600}
.dlab{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:11px;color:var(--ink4);text-align:center}
.sym p{font-size:13.5px;color:var(--ink2);margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink3);margin:2px 4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.acc>button{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:600;min-height:28px;text-align:left;gap:10px}
.acc p{margin-top:10px;color:var(--ink2);font-size:14px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.set:first-child{border-top:0;padding-top:0}.set:last-child{padding-bottom:0}
.set b{font-weight:500;display:block}.set small{color:var(--ink3);font-size:12.5px}
.tg{width:48px;height:28px;border-radius:99px;background:#d1d5db;position:relative;flex:none;transition:background .15s}
.tg:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg[aria-checked=true]{background:var(--blue)}.tg[aria-checked=true]:after{left:23px}
.foot{font-size:12.5px;color:var(--ink3);margin:14px 4px 0}
.back{display:flex;align-items:center;gap:4px;padding:4px 10px 6px;flex:none}
/* side panel */
.out{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.out h1{font-size:30px;letter-spacing:-.02em}
.out>p,.out .lead{color:var(--ink3);max-width:620px}
.pan{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--sh)}
.pan h3{font-size:17px}
.pan h3+small{color:var(--ink3);font-size:13px;display:block;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stats div{background:var(--app);border-radius:16px;padding:12px 14px}
.stats b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.stats small{color:var(--ink3);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
th{text-align:left;font-weight:500;color:var(--ink3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2)}
td.n,th.n{text-align:right}
.ochip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--gsoft);color:var(--green);font-weight:600;font-size:13px;border:1px solid var(--gline)}
.ochip i{width:8px;height:8px;border-radius:50%;background:#22c55e}
.ochips{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}
@media(max-width:440px){.wrap{padding:0}.stage{width:100%;height:100svh}.stage>.phone{transform:none;width:100%;height:100svh;border:0;border-radius:0;box-sizing:border-box}}

/* ---------- web-portal look: light headers, white cards, blue as accent ---------- */
:root{--app:#f3f5f8;--r:18px;--sh:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04)}
.card{border:1.5px solid var(--line);box-shadow:none}
.hero{background:var(--app);color:var(--ink);border-radius:0;padding:8px 20px 6px;overflow:visible}
.hero:before,.hero:after{display:none}
.hrow b{font-size:22px;font-weight:600}
.hrow span.s,.hero p.sub{color:var(--ink3);opacity:1}
.hero .av{border:0}
.hbtn{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.hbtn .dot{border-color:#fff;top:9px;right:10px}
.hero .sbox{border:1.5px solid var(--line);box-shadow:none}
.hero .seg{background:#e8ecf2}
.hero .seg button{color:var(--ink3)}
.hero .seg button[aria-pressed=true]{background:#fff;color:var(--blue2);box-shadow:var(--sh)}
.week button{color:var(--ink2);opacity:1;background:#fff;border:1.5px solid var(--line)}
.week button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.week button i{color:var(--blue)}.week button[aria-pressed=true] i{color:#fff}
.sec{padding-top:12px}
.tile span{border:1.5px solid var(--line);box-shadow:none;border-radius:18px}
.pnav{border:1.5px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.ctop,.prog{background:#fff}
.prog{border-bottom:1.5px solid var(--line2)}
.mr .bub{border-width:1.5px;box-shadow:none}
.qopt{border-width:1.5px}
.task .rm{background:var(--bsoft)}
.med.pri{background:#fff;border-color:var(--bline)}
/* language */
.lpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:13.5px;border:1px solid rgba(255,255,255,.25)}
.lpill.l{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.lsh{max-height:86%;display:flex;flex-direction:column;padding-bottom:34px}
.shh{display:flex;justify-content:space-between;align-items:center}
.shh h2{font-size:20px}
.llist{overflow-y:auto;margin:10px -6px 0;flex:1;min-height:120px}
.llist button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border-radius:14px;text-align:start}
.llist button:hover{background:#f3f4f6}
.llist button[aria-pressed=true]{background:var(--bsoft);color:var(--blue2)}
.llist b{font-weight:600;display:block}.llist small{color:var(--ink3);font-size:12.5px}
.olang{display:flex;gap:8px;margin-top:10px;padding-top:12px;border-top:1.5px solid var(--line2)}
.olang input{flex:1;height:44px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;outline:none;background:var(--app)}
.trn{display:flex;align-items:center;gap:6px;padding:6px 18px;background:var(--bsoft);color:var(--blue2);font-size:12px;font-weight:500;flex:none}
.trpill{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#111827;color:#fff;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;z-index:12}
.phone[dir=rtl] .ctop .ib:first-child svg,.phone[dir=rtl] .back svg{transform:scaleX(-1)}
/* sign in */
.signin{flex:1;display:flex;flex-direction:column;padding:12px 20px 40px;overflow-y:auto}
.sih{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.brand .lg{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}
.sic{margin-top:auto;margin-bottom:auto;padding:24px}
.sic h1{font-size:26px}
.fl{display:block;font-size:13.5px;font-weight:500;color:var(--ink2);margin-bottom:12px}
.inp{display:flex;align-items:center;gap:10px;height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;margin-top:6px;color:var(--ink3);background:#fff}
.inp:focus-within{border-color:var(--blue)}
.inp input{flex:1;border:0;outline:0;background:none;color:var(--ink);font-size:15px}
.note2{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:10px 12px;border-radius:12px;background:var(--app);font-size:12.5px;color:var(--ink3)}
.note2 svg{color:var(--green);margin-top:1px}
.signout{color:var(--red)!important;border-color:var(--rline)!important}

/* Remi task card, as in the original design */
.tcard{padding:0;overflow:hidden}
.tcard .task{grid-template-columns:150px minmax(0,1fr);gap:0;align-items:stretch}
.tcard .task .rm{width:140px;height:auto;min-height:140px;border-radius:0;background:none;display:grid;place-items:center}
.tcard .rav{box-shadow:0 0 0 12px #eef3ff,0 12px 26px rgba(47,95,216,.28)}
.wremi{display:flex;justify-content:center;margin-bottom:22px}
.wremi .rav{background:linear-gradient(150deg,#6d93f7,#3563e0);box-shadow:0 0 0 12px rgba(255,255,255,.14),0 0 0 24px rgba(255,255,255,.07),0 16px 30px rgba(10,30,90,.35)}
.tcard .task .tx{padding:18px 16px;align-self:center}
.tcard .tbody{padding:0 16px 16px}
.tcard .tbody:empty{display:none}
.tcard .tbody>.btn{margin-top:14px!important}

/* photos */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.thumbs span{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(17,24,39,.75);color:#fff;display:grid;place-items:center}
.addph{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1.5px dashed var(--bline);color:var(--blue2);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:14px}
.sheet textarea{margin-bottom:10px}
.nimgs{display:grid;gap:6px;margin-top:10px;border-radius:14px;overflow:hidden}
.nimgs.n2{grid-template-columns:1fr 1fr}.nimgs.n3{grid-template-columns:1fr 1fr 1fr}
.nimgs img{width:100%;aspect-ratio:4/3;object-fit:cover;margin:0;border-radius:10px}
.nimgs.n1 img{aspect-ratio:auto;max-height:260px}
/* messages */
.ni{position:relative;display:block}
.nb{position:absolute;top:-5px;right:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ef4444;color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.pnav{grid-template-columns:repeat(5,1fr)}
.urg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--asoft);border:1.5px solid var(--aline);color:#854d0e;font-size:13px}
.urg svg{margin-top:1px}
.urg.flat{border-radius:0;border-width:0 0 1.5px;padding:8px 16px;font-size:12px;flex:none}
.thl{padding:6px;margin-top:12px}
.th{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:12px 10px;border-radius:14px}
.th+.th{border-top:1.5px solid var(--line2);border-radius:0 0 14px 14px}
.th:hover{background:#f9fafb}
.th .b{flex:1;min-width:0}
.th .r1{display:flex;justify-content:space-between;gap:8px}
.th .r1 b{font-weight:600}.th .r1 small,.th .rl{color:var(--ink3);font-size:12px}
.th .rl{display:block}
.th .pv{display:block;color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.th.un .pv{color:var(--ink);font-weight:600}
.ud{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border-top:1.5px solid var(--line2);text-align:start;margin-top:8px}
.pick span{flex:1}.pick b{display:block;font-weight:600}.pick small{color:var(--ink3);font-size:12.5px}
.dsep{text-align:center;margin:6px 0}
.dsep span{font-size:11.5px;color:var(--ink3);background:#e9edf3;padding:3px 10px;border-radius:999px}
.mr .av{border:0}
.bub img{display:block;max-width:200px;width:100%;border-radius:12px;margin-bottom:6px}
.bub small.mt{display:block;font-size:11px;opacity:.7;margin-top:4px;text-align:end}
.typing{display:flex;gap:4px;padding:12px 14px!important}
.typing i{width:7px;height:7px;border-radius:50%;background:#9ca3af;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.msgbar{flex-direction:column;align-items:stretch}
.msgbar .thumbs{margin:0 0 4px}

/* Remi chat, as in the design reference */
.rav{border-radius:50%;background:linear-gradient(150deg,#5b86f5,#2f5fd8);display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(47,95,216,.28)}
.ctop{padding:8px 14px 10px}
.ctop .t{gap:12px}
.ctop .t b{font-size:18px}
.segs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.segs i{height:6px;border-radius:99px;background:#e6eaf3}
.segs i.d{background:#3563e0}
.segs i.c{background:linear-gradient(90deg,#3563e0 55%,#e6eaf3 55%)}
.prog .l b{color:var(--ink);font-weight:700}
.prog{border-bottom:0}
.chat{background:#fff;padding:14px 18px 10px;gap:10px}
.mr.rb .bub{background:#f1f3f8;border:0;border-radius:20px;max-width:86%;color:var(--ink)}
.mr.me .bub{background:linear-gradient(180deg,#4f7cf0,#3563e0);border:0;border-radius:18px;box-shadow:0 4px 12px rgba(53,99,224,.22)}
.mr.rb .bub.sys{background:var(--bsoft)}
.mr.rb .bub.help{background:var(--asoft)}
.mr.rb .bub.alert{background:var(--rsoft)}
.mr.rb .bub.done{background:var(--gsoft)}
.ans{border-top:1.5px solid var(--line2)}

.ctop .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.menu.cm{right:0;left:auto;top:44px;min-width:210px}
.menu.cm button{display:flex;align-items:center;gap:10px}
.menu.cm button span{flex:1}.menu.cm small{color:var(--ink3);font-size:12.5px}
</style>
</head>

 <p class="foot" style="margin:0">Prototype with fictional data. Grades use a simplified mapping (highest item score, capped at 3), not the validated PRO-CTCAE composite algorithm. Spanish wording here is our own; a real app should use NCI’s official Spanish PRO-CTCAE items. Plain-language hints are optional help, shown under the standard answer choices.</p>`}
function view(){const scr={messages,welcome,signin,home,chat,notes,treat,res,reports,profile}[S.ps]();return`<div class="wrap"><div class="stage"><div class="phone ${S.big?'big':''}" lang="${LG()[3].split('-')[0]}" dir="${LG()[4]?'rtl':'ltr'}">${scr}${S.lsheet?langSheet():''}${pending()&&S.ps!=='chat'?`<div class="trpill">${ic('globe',14,2)}${t(L('Translating…','Traduciendo…'))}</div>`:''}<span class="hind"></span></div></div></div>`}

/* ---------- render & events ---------- */
const app=$('app');
function toast(x){const el=$('toast');el.textContent=x;el.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>el.hidden=true,2200)}
function say(){try{const m=[...C.log].reverse().find(x=>!x.me);const u=new SpeechSynthesisUtterance(t(m.h).replace(/<[^>]+>/g,' '));u.lang=LG()[3];speechSynthesis.cancel();speechSynthesis.speak(u);return true}catch(_){return false}}
let lastLen=0;
function render(){const ch0=$('chat'),grew=C.log.length!==lastLen;lastLen=C.log.length;const keep=ch0?ch0.scrollTop:0;
 app.innerHTML=view();document.documentElement.lang=S.lang;
 const ch=$('chat');if(ch)ch.scrollTop=grew?ch.scrollHeight:keep;
 if(grew&&S.speak&&S.ps==='chat')say();
 if(S.focus){const e=$(S.focus);if(e){e.focus();const l=e.value.length;try{e.setSelectionRange(l,l)}catch(_){}}S.focus=null}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');
 if(!b){if(S.menu!==null||S.cmenu){S.menu=null;S.cmenu=false;render()}return}
 const a=b.dataset.a,v=b.dataset.v,i=+b.dataset.i;if(a!=='nmenu')S.menu=null;if(!['cmenu','big','speak'].includes(a))S.cmenu=false;
 switch(a){
 case'ps':S.ps=v;if(v==='messages'&&b.closest('.pnav'))S.msgT=null;if(v==='chat'){if(!C.started||C.sent&&!C.p)startChat();else if(C.paused)resume()}break;
 case'q':{const p=C.p;me(p.opts[i]);C.p=null;p.cb(i);break}
 case'qsame':{const p=C.p;me(LD(()=>[`Same as last week (${SC[p.it][0][p.same].en})`,`Igual que la semana pasada (${SC[p.it][0][p.same].es})`]));C.p=null;p.cb(p.same,'same');break}
 case'qskip':{const p=C.p;me(L('Skip this one','Saltar esta'));C.p=null;if(p.multi){bot(L('No problem, we’ll skip that.','No hay problema, lo saltamos.'));p.cb(null)}else p.cb(null,'skip');break}
 case'qhelp':{const p=C.p,k=p.help||(p.scale?(p.it==='int'||p.it==='freq'?null:p.s):null);const parts=[];if(p.scale&&HELP[p.s])parts.push(HELP[p.s]);if(p.help&&!p.scale)parts.push(HELP[p.help]);if(p.scale&&(p.it==='int'||p.it==='freq'))parts.push(HELP[p.it]);
  me(L('What does this mean?','¿Qué significa?'));bot(()=>parts.map(t).join(' ')+(p.scale?' '+t(L('The words under each answer can help you choose. There are no wrong answers.','Las palabras debajo de cada respuesta pueden ayudarle a elegir. No hay respuestas incorrectas.')):''),'help');break}
 case'mq':{const p=C.p;if(i===p.excl)p.sel=new Set([i]);else{p.sel.delete(p.excl);p.sel.has(i)?p.sel.delete(i):p.sel.add(i)}break}
 case'mqd':{const p=C.p;if(!p.sel.size)return;const sel=[...p.sel].sort((x,y)=>x-y);me(sel.map(j=>p.opts[j]));C.p=null;p.cb(sel);break}
 case'pausec':pauseChat();toast(t(L('Saved. Resume any time from Home.','Guardado. Continúe cuando quiera desde Inicio.')));break;
 case'lang':S.lang=v;S.lsheet=false;S.langQ='';break;
 case'lsheet':S.lsheet=!S.lsheet;S.cmenu=false;S.langQ='';break;
 case'signout':S.ps='welcome';S.lsheet=false;toast(t(L('You’re signed out','Cerró sesión')));break;
 case'big':S.big=!S.big;S.cmenu=false;break;
 case'cmenu':S.cmenu=!S.cmenu;break;
 case'autospk':S.speak=!S.speak;break;
 case'speak':if(!say())toast(t(L('Read-aloud isn’t available in this browser','La lectura en voz alta no está disponible en este navegador')));return;
 case'nm':S.noteMode=v;break;case'nd':S.noteDay=new Date(+v);S.noteMode='day';break;case'fav':S.fav=!S.fav;break;
 case'nmenu':S.menu=S.menu===i?null:i;break;case'nfav':ME.notes[i].fav=!ME.notes[i].fav;break;case'ndel':ME.notes.splice(i,1);toast(t(L('Note deleted','Nota borrada')));break;
 case'compose':S.composer=true;S.noteDraft='';S.noteImgs=[];render();$('nt')?.focus();return;case'compx':S.composer=false;break;
 case'nrm':S.noteImgs.splice(i,1);break;case'mrm':S.msgImgs.splice(i,1);break;
 case'mt':S.msgT=v||null;S.msgNew=false;if(v){const th=TH.find(x=>x.id===v);th.unread=0}break;
 case'mnew':S.msgNew=!S.msgNew;break;
 case'mreply':S.ps='messages';S.msgT=v;TH.find(x=>x.id===v).unread=0;break;
 case'tt':S.treat=v;break;case'ro':S.resOpen=S.resOpen===i?-1:i;break;case'rep':S.repOpen=S.repOpen===i?-1:i;break;
 default:return}
 render()});
document.addEventListener('change',e=>{const x=e.target;
 if(x.id==='nimg'){S.noteDraft=$('nt')?.value||S.noteDraft;readImgs(x.files,a=>{S.noteImgs=[...(S.noteImgs||[]),...a].slice(0,6);render()});return}
 if(x.id==='mimg'){S.msgDraft=$('mi')?.value||S.msgDraft;readImgs(x.files,a=>{S.msgImgs=[...(S.msgImgs||[]),...a].slice(0,4);render()});return}
 if(x.id==='cimg'&&x.files[0]){const f=x.files[0];if(!f.type.startsWith('image/'))return;const fr=new FileReader();fr.onload=()=>{me('',fr.result);addNote(t(L('Photo shared during check-in.','Foto compartida durante el reporte.')),fr.result);bot(L('Thanks! I’ve saved the photo to your notes for Dr. Hart.','¡Gracias! Guardé la foto en sus notas para el Dr. Hart.'));render()};fr.readAsDataURL(f)}});
document.addEventListener('input',e=>{const x=e.target,k=x.dataset.in;if(!k)return;S[k]=x.value;S.focus=x.id;render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f;
 if(k==='chatin'){const x=$('ci').value.trim();if(!x)return;if(!C.started){startChat()}me(x);
  if(C.p?.text){C.note=x;addNote(x);C.p=null;bot(L('Got it. I’ve added your note for Dr. Hart.','Entendido. Agregué su nota para el Dr. Hart.'));summary()}
  else{addNote(x);bot(L('Got it. I’ve saved that as a note for Dr. Hart.','Entendido. Lo guardé como nota para el Dr. Hart.'));if(C.p&&C.lastQ)C.log.push({...C.lastQ})}render();$('ci')?.focus()}
 else if(k==='note'){const x=$('nt').value.trim(),im=S.noteImgs||[];if(!x&&!im.length)return;addNote(x||t(L('Photo note','Nota con foto')),im);S.noteImgs=[];S.noteDraft='';S.composer=false;S.noteMode='week';toast(t(L('Note saved','Nota guardada')));render()}
 else if(k==='olang'){const v=$('ol').value.trim();if(!v)return;const hit=LANGS.find(x=>[x[1],x[2]].some(n=>n.toLowerCase()===v.toLowerCase()));S.lang=hit?hit[0]:'x:'+v.replace(/[^\p{L}\p{M} ()'-]/gu,'').slice(0,40);S.lsheet=false;S.langQ='';render()}
 else if(k==='signin'){S.ps='home';render()}
 else if(k==='msg'){const x=($('mi')?.value||'').trim(),im=S.msgImgs||[];if(!x&&!im.length)return;const th=TH.find(z=>z.id===S.msgT);th.m.forEach(m=>{if(m.who==='me')m.read=true});th.m.push({who:'me',t:new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate(),new Date().getHours(),new Date().getMinutes()),h:x,imgs:im});S.msgDraft='';S.msgImgs=[];render();$('mi')?.focus();
  const id=th.id;if(th.pending)return;th.pending=1;setTimeout(()=>{th.typing=1;th.m.at(-1).read=true;render()},1400);setTimeout(()=>{th.typing=0;th.pending=0;th.m.push({who:id,t:new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate(),new Date().getHours(),new Date().getMinutes()),h:REPLY[id]});if(!(S.ps==='messages'&&S.msgT===id))th.unread++;render()},4200)}
 else if(k==='hsearch'){S.noteQ=$('hq').value.trim();S.noteMode='week';S.ps='notes';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&(e.target.id==='ci'||e.target.id==='mi')){e.preventDefault();e.target.form.requestSubmit()}});
function fit(){const k=Math.min(1,(innerHeight-40)/876,(innerWidth-32)/417);document.documentElement.style.setProperty('--k',k.toFixed(4))}addEventListener('resize',fit);fit();
C=fresh();render();
window.__curo={get S(){return S},get C(){return C},render,ME};

}
